[package]
name = "pupil-app"
version = "1.0.0-beta.3"
description = "Pupil desktop app"
authors = ["Pupil"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "pupil_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
default = []
# Local development aid only. The MCP bridge grants arbitrary JS and shell
# command execution to whatever connects to it, so it must never be compiled
# into a distributed build. `bun run --cwd apps/app dev` enables it; release
# bundles built by `tauri build` leave it out entirely.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
base64 = "0.22"
nanoid = "0.4.0"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-mcp-bridge = { version = "0.11.2", optional = true }
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"

